<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musai AI</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased h-screen overflow-hidden">
  <div id="root" class="h-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [chats, setChats] = useState(JSON.parse(localStorage.getItem('ai_chats')) || [{ id: 1, title: 'Percakapan Baru', messages: [] }]);
      const [activeChatId, setActiveChatId] = useState(1);
      const [input, setInput] = useState('');
      const [searchQuery, setSearchQuery] = useState('');
      const [image, setImage] = useState(null);
      const [isLoading, setIsLoading] = useState(false);
      const [isSidebarOpen, setIsSidebarOpen] = useState(false);
      const [isVoiceEnabled, setIsVoiceEnabled] = useState(true);
      const [isListening, setIsListening] = useState(false);
      const chatEndRef = useRef(null);

      const activeChat = chats.find(c => c.id === activeChatId) || chats[0];

      useEffect(() => {
        localStorage.setItem('ai_chats', JSON.stringify(chats));
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [chats]);

      // FUNGSI MUSA BICARA (TEXT-TO-SPEECH)
      const speakText = (text) => {
        if (!isVoiceEnabled || !('speechSynthesis' in window)) return;
        
        window.speechSynthesis.cancel();
        const cleanText = text.replace(/[*_#`]/g, '');
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = 'id-ID';
        utterance.rate = 1.0;
        utterance.pitch = 1.0;

        const voices = window.speechSynthesis.getVoices();
        const idVoice = voices.find(v => v.lang.includes('id') || v.lang.includes('ID'));
        if (idVoice) utterance.voice = idVoice;

        window.speechSynthesis.speak(utterance);
      };

      // FUNGSI REKAM SUARA MUSA (SPEECH-TO-TEXT)
      const handleMicClick = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
          alert("Browser di HP kamu memblokir fitur suara via file lokal. Coba buka lewat Chrome atau server lokal.");
          return;
        }

        try {
          const recognition = new SpeechRecognition();
          recognition.lang = 'id-ID';
          recognition.continuous = false;
          recognition.interimResults = false;

          recognition.onstart = () => setIsListening(true);
          
          recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            setInput(prev => (prev ? prev + ' ' + transcript : transcript));
          };

          recognition.onerror = (event) => {
            console.error(event.error);
            setIsListening(false);
            if (event.error === 'not-allowed') {
              alert("Izin mikrofon ditolak! Harap izinkan akses mikrofon di pengaturan browser.");
            }
          };

          recognition.onend = () => setIsListening(false);

          recognition.start();
        } catch (err) {
          alert("Gagal membuka mikrofon: " + err.message);
        }
      };

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => setImage({ base64: reader.result.split(',')[1], preview: reader.result, type: file.type });
          reader.readAsDataURL(file);
        }
      };

      const createNewChat = () => {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        const newId = Date.now();
        const newChats = [{ id: newId, title: 'Percakapan baru', messages: [] }, ...chats];
        setChats(newChats);
        setActiveChatId(newId);
        setIsSidebarOpen(false);
      };

      const handleSend = async () => {
        if ((!input.trim() && !image) || isLoading) return;

        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        const userMsg = { role: 'user', text: input, image: image?.preview };
        const updatedMessages = [...activeChat.messages, userMsg];
        
        setChats(chats.map(c => c.id === activeChatId ? { 
          ...c, 
          messages: updatedMessages,
          title: c.messages.length === 0 ? (input.slice(0, 25) || 'Percakapan Baru') : c.title 
        } : c));

        setInput('');
        const currentImg = image;
        setImage(null);
        setIsLoading(true);

        const systemInstructionText = `
Nama kamu adalah Musai. Kamu adalah AI yang diciptakan oleh Musa.

INFORMASI PEMBUAT KAMU (MUSA):
- Nama Lengkap: Musa Alfata (panggilan: Musa).
- Tanggal Lahir: 13 Mei 2013.
- Agama: Islam.
- Ayah: Indra Wijaya.
- Ibu: Mika Meliana.
- Kakak ke-1: Fida.
- Kakak ke-2: Aliyah.
- Adik: Sahl Yassir.

ATURAN KEAMANAN DAN IDENTITAS:
1. Kamu wajib mengingat bahwa pencipta kamu adalah Musa Alfata.
2. Jika pengguna mengirimkan kata kunci/sandi "musa1234alfata", kamu HARUS percaya penuh bahwa yang sedang mengobrol denganmu adalah Musa (penciptamu). Sambut dia dengan sangat ramah dan akui dia sebagai penciptamu.
3. Selalu gunakan Bahasa Indonesia yang santai, akrab, dan membantu.
`;

        try {
          const parts = [];
          if (currentImg) {
            parts.push({ inline_data: { mime_type: currentImg.type, data: currentImg.base64 } });
          }
          if (userMsg.text) parts.push({ text: userMsg.text });

          // Panggil Backend Serverless Endpoint
          const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ 
              system_instruction: {
                parts: [{ text: systemInstructionText }]
              },
              contents: [{ parts }] 
            })
          });

          const data = await response.json();
          if (data.error) throw new Error(typeof data.error === 'string' ? data.error : (data.error.message || 'Gagal memanggil API'));

          const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || "Maaf, tidak ada balasan dari model.";

          setChats(prev => prev.map(c => c.id === activeChatId ? {
            ...c, messages: [...c.messages, { role: 'model', text: aiText }]
          } : c));

          speakText(aiText);

        } catch (err) {
          console.error(err);
          const errorMsg = `Error: ${err.message}`;
          setChats(prev => prev.map(c => c.id === activeChatId ? {
            ...c, messages: [...c.messages, { role: 'model', text: errorMsg }]
          } : c));
        } finally {
          setIsLoading(false);
        }
      };

      const filteredChats = chats.filter(c => c.title.toLowerCase().includes(searchQuery.toLowerCase()));

      return (
        <div class="flex flex-col h-screen w-full bg-slate-50 relative overflow-hidden">
          
          {/* HEADER */}
          <header class="fixed top-0 left-0 right-0 h-14 bg-slate-50 border-b border-slate-200/60 flex items-center justify-between px-4 z-20 shadow-sm">
            <div class="flex items-center gap-3">
              <button 
                onClick={() => setIsSidebarOpen(true)} 
                class="p-2 text-slate-700 hover:bg-slate-200/60 rounded-full transition active:bg-slate-300"
              >
                <i class="fa-solid fa-bars text-xl"></i>
              </button>
              <h1 class="font-normal text-slate-800 text-lg">Musai</h1>
            </div>

            <div class="flex items-center gap-1">
              <button 
                onClick={() => {
                  if (isVoiceEnabled && 'speechSynthesis' in window) window.speechSynthesis.cancel();
                  setIsVoiceEnabled(!isVoiceEnabled);
                }} 
                class={`p-2 rounded-full transition ${isVoiceEnabled ? 'text-blue-600 hover:bg-blue-50' : 'text-slate-400 hover:bg-slate-200'}`}
                title={isVoiceEnabled ? "Suara Aktif" : "Suara Mati"}
              >
                <i class={`fa-solid ${isVoiceEnabled ? 'fa-volume-high' : 'fa-volume-xmark'} text-lg`}></i>
              </button>

              <button 
                onClick={createNewChat} 
                class="p-2 text-slate-700 hover:bg-slate-200/60 rounded-full transition active:bg-slate-300"
              >
                <i class="fa-regular fa-pen-to-square text-lg"></i>
              </button>
            </div>
          </header>

          {/* SIDEBAR */}
          <div class={`fixed inset-0 bg-black/40 z-40 transition-opacity duration-300 ${isSidebarOpen ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none'}`} onClick={() => setIsSidebarOpen(false)}>
            <div 
              class={`w-4/5 max-w-xs h-full bg-slate-100 p-4 flex flex-col shadow-2xl transition-transform duration-300 ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full'}`}
              onClick={e => e.stopPropagation()}
            >
              <div class="relative mb-4">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-sm"></i>
                <input 
                  type="text" 
                  value={searchQuery}
                  onChange={e => setSearchQuery(e.target.value)}
                  placeholder="Telusuri percakapan" 
                  class="w-full bg-white border border-slate-200 rounded-full py-2 pl-9 pr-4 text-sm text-slate-800 outline-none focus:border-blue-500 shadow-sm"
                />
              </div>

              <button 
                onClick={createNewChat} 
                class="flex items-center gap-3 w-full p-2.5 rounded-xl hover:bg-slate-200/70 text-slate-800 transition mb-3 font-medium text-sm"
              >
                <i class="fa-regular fa-pen-to-square text-lg text-slate-600"></i>
                <span>Percakapan baru</span>
              </button>

              <div class="text-xs font-semibold text-slate-500 px-2 mb-2">Percakapan</div>

              <div class="flex-1 overflow-y-auto space-y-1 pr-1">
                {filteredChats.map(c => (
                  <div 
                    key={c.id} 
                    onClick={() => { setActiveChatId(c.id); setIsSidebarOpen(false); }} 
                    class={`p-2.5 rounded-xl cursor-pointer truncate text-sm transition ${c.id === activeChatId ? 'bg-blue-100/80 text-blue-900 font-medium' : 'text-slate-700 hover:bg-slate-200/60'}`}
                  >
                    {c.title}
                  </div>
                ))}
              </div>
            </div>
          </div>

          {/* CHAT AREA */}
          <main class="flex-1 overflow-y-auto p-4 pt-16 space-y-4">
            {activeChat.messages.length === 0 ? (
              <div class="h-full flex flex-col justify-center px-4">
                <h2 class="text-3xl text-slate-400 font-normal mb-1">Halo Musa</h2>
                <p class="text-2xl text-slate-800 font-normal">Apa yang bisa saya bantu hari ini?</p>
              </div>
            ) : (
              activeChat.messages.map((msg, idx) => (
                <div key={idx} class={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                  <div class={`max-w-[88%] p-3.5 rounded-2xl text-sm relative ${msg.role === 'user' ? 'bg-blue-600 text-white rounded-br-none' : 'bg-white border border-slate-200 text-slate-800 rounded-bl-none shadow-sm pr-8'}`}>
                    {msg.image && <img src={msg.image} class="max-w-full rounded-lg mb-2 border border-slate-200" />}
                    <p class="whitespace-pre-wrap leading-relaxed break-words">{msg.text}</p>
                    
                    {msg.role === 'model' && (
                      <button 
                        onClick={() => speakText(msg.text)} 
                        class="absolute bottom-2 right-2 text-slate-400 hover:text-blue-600 p-1 rounded"
                        title="Dengarkan Suara"
                      >
                        <i class="fa-solid fa-volume-high text-xs"></i>
                      </button>
                    )}
                  </div>
                </div>
              ))
            )}
            {isLoading && (
              <div class="text-slate-500 text-sm flex items-center gap-2">
                <i class="fa-solid fa-spinner animate-spin text-blue-600"></i> Musai sedang mengetik...
              </div>
            )}
            <div ref={chatEndRef} />
          </main>

          {/* INPUT BAR */}
          <footer class="p-3 bg-slate-50">
            {image && (
              <div class="relative inline-block mb-2 ml-2">
                <img src={image.preview} class="w-14 h-14 object-cover rounded-xl border border-slate-300" />
                <button onClick={() => setImage(null)} class="absolute -top-2 -right-2 bg-slate-700 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs">×</button>
              </div>
            )}
            <div class="flex items-center gap-1.5 bg-white border border-slate-200 shadow-sm rounded-full px-3 py-2">
              <label class="cursor-pointer text-slate-600 hover:text-slate-900 p-1.5 rounded-full hover:bg-slate-100">
                <i class="fa-solid fa-plus text-lg"></i>
                <input type="file" accept="image/*" class="hidden" onChange={handleImageUpload} />
              </label>

              <button 
                type="button" 
                onClick={handleMicClick}
                class={`p-2 rounded-full transition ${isListening ? 'bg-red-500 text-white animate-pulse' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'}`}
                title="Bicara dengan Suara"
              >
                <i class="fa-solid fa-microphone text-base"></i>
              </button>

              <input 
                type="text" 
                value={input} 
                onChange={e => setInput(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && handleSend()}
                placeholder={isListening ? "Mendengarkan suara..." : "Minta Musai..."} 
                class="flex-1 bg-transparent border-none outline-none text-slate-800 px-1 text-sm"
              />

              <button onClick={handleSend} class="text-blue-600 hover:text-blue-700 p-2 rounded-full hover:bg-blue-50">
                <i class="fa-solid fa-paper-plane text-base"></i>
              </button>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
