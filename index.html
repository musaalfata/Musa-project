<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musai - AI Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #f4f7f6; display: flex; flex-direction: column; height: 100vh; }
    header { background-color: #1a73e8; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
    .user-profile { display: flex; align-items: center; gap: 10px; }
    .user-profile img { width: 32px; height: 32px; border-radius: 50%; }
    .btn { background: white; color: #1a73e8; border: none; padding: 8px 12px; border-radius: 5px; font-weight: bold; cursor: pointer; }
    #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
    .message { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
    .user { background: #1a73e8; color: white; align-self: flex-end; }
    .bot { background: #e4e6eb; color: #000; align-self: flex-start; }
    #input-form { display: flex; padding: 10px; background: white; border-top: 1px solid #ddd; }
    #input-form input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
    #input-form button { margin-left: 8px; padding: 10px 18px; background: #1a73e8; color: white; border: none; border-radius: 20px; font-weight: bold; cursor: pointer; }
    #auth-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #ffffff; }
    #auth-screen button { padding: 12px 24px; font-size: 16px; background: #4285f4; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Layar Login -->
  <div id="auth-screen">
    <h1 style="margin-bottom:20px;">Selamat Datang di Musai</h1>
    <button id="btn-login">Login dengan Google</button>
  </div>

  <!-- Layar Utama Chat -->
  <div id="app-screen" class="hidden">
    <header>
      <h2>Musai</h2>
      <div class="user-profile">
        <img id="user-photo" src="" alt="User">
        <span id="user-name"></span>
        <button id="btn-logout" class="btn">Logout</button>
      </div>
    </header>

    <div id="chat-container"></div>

    <form id="input-form">
      <input type="text" id="user-input" placeholder="Ketik pesan..." autocomplete="off" required />
      <button type="submit">Kirim</button>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBWoH8J22lGWn_ksCDIGVINgqwDC0bEfz4",
      authDomain: "musai-ai.firebaseapp.com",
      projectId: "musai-ai",
      storageBucket: "musai-ai.firebasestorage.app",
      messagingSenderId: "883156863077",
      appId: "1:883156863077:web:3b56ec95f358cc58f0de8c",
      measurementId: "G-TM822HZ4HM"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const authScreen = document.getElementById('auth-screen');
    const appScreen = document.getElementById('app-screen');
    const btnLogin = document.getElementById('btn-login');
    const btnLogout = document.getElementById('btn-logout');
    const userName = document.getElementById('user-name');
    const userPhoto = document.getElementById('user-photo');
    const chatContainer = document.getElementById('chat-container');
    const inputForm = document.getElementById('input-form');
    const userInput = document.getElementById('user-input');

    let currentUser = null;
    let unsubscribeChat = null;

    btnLogin.addEventListener('click', () => signInWithPopup(auth, provider));
    btnLogout.addEventListener('click', () => signOut(auth));

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        userName.textContent = user.displayName;
        userPhoto.src = user.photoURL || 'https://via.placeholder.com/32';
        authScreen.classList.add('hidden');
        appScreen.classList.remove('hidden');
        loadChatHistory(user.uid);
      } else {
        currentUser = null;
        authScreen.classList.remove('hidden');
        appScreen.classList.add('hidden');
        chatContainer.innerHTML = '';
        if (unsubscribeChat) unsubscribeChat();
      }
    });

    function loadChatHistory(uid) {
      const chatRef = collection(db, "users", uid, "messages");
      const q = query(chatRef, orderBy("timestamp", "asc"));

      unsubscribeChat = onSnapshot(q, (snapshot) => {
        chatContainer.innerHTML = '';
        snapshot.forEach((doc) => {
          const data = doc.data();
          appendMessage(data.text, data.sender);
        });
        chatContainer.scrollTop = chatContainer.scrollHeight;
      });
    }

    function appendMessage(text, sender) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', sender);
      msgDiv.textContent = text;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    inputForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = userInput.value.trim();
      if (!text || !currentUser) return;

      userInput.value = '';

      const chatRef = collection(db, "users", currentUser.uid, "messages");
      await addDoc(chatRef, {
        text: text,
        sender: 'user',
        timestamp: serverTimestamp()
      });

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: text })
        });

        const data = await response.json();
        const replyText = data?.candidates?.[0]?.content?.parts?.[0]?.text || 'Tidak ada balasan dari AI.';

        await addDoc(chatRef, {
          text: replyText,
          sender: 'bot',
          timestamp: serverTimestamp()
        });

      } catch (err) {
        await addDoc(chatRef, {
          text: `Gagal menghubungkan ke AI: ${err.message}`,
          sender: 'bot',
          timestamp: serverTimestamp()
        });
      }
    });
  </script>
</body>
</html>
